<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semka AI — премиальный помощник</title>
<style>
:root{
  --bg:#0d120e; --panel:#141c16; --panel2:#1b2620;
  --green:#00c292; --green-dark:#008f68; --green-deep:#0f2b1d;
  --text:#e6efe9; --dim:#8aa898;
  --border:rgba(0,194,146,.25); --glow:rgba(0,194,146,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI',Tahoma,Verdana,sans-serif; background:radial-gradient(circle at 30% 0%, #16241c 0%, var(--bg) 60%); color:var(--text); height:100vh; overflow:hidden;}

/* ===== Верхняя панель ===== */
#topbar{position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:12px; padding:0 14px; background:rgba(13,18,14,.92); border-bottom:1px solid var(--border); z-index:50; backdrop-filter:blur(6px);}
#menuBtn{width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); color:var(--green); font-size:18px; cursor:pointer; transition:.2s; z-index:60;}
#menuBtn:hover{background:var(--green-deep); box-shadow:0 0 12px var(--glow);}
#brand{font-weight:700; letter-spacing:2px; font-size:17px;
  background:linear-gradient(90deg,#7dffd4,var(--green),#4affb0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 0 18px rgba(0,194,146,.35);}
#newChat{margin-left:auto; padding:9px 16px; border-radius:10px; border:1px solid var(--border); background:linear-gradient(135deg,#0f3b2b,var(--green-dark)); color:#eafff6; font-size:14px; cursor:pointer; transition:.2s;}
#newChat:hover{box-shadow:0 0 14px var(--glow); transform:translateY(-1px);}

/* ===== Панель истории ===== */
#overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:.25s; z-index:55;}
#overlay.show{opacity:1; pointer-events:auto;}
#sidebar{position:fixed; top:52px; bottom:0; left:0; width:280px; background:var(--panel); border-right:1px solid var(--border); padding:12px; display:flex; flex-direction:column; gap:10px; transform:translateX(-100%); transition:transform .25s; z-index:56;}
#sidebar.open{transform:translateX(0);}
#storageWarn{display:none; background:#4a3208; border:1px solid #b8860b; color:#ffe9a8; padding:10px; border-radius:8px; font-size:12.5px; line-height:1.4;}
#chatList{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px;}
.chat-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--dim); white-space:nowrap; overflow:hidden; transition:.15s;}
.chat-item span.t{overflow:hidden; text-overflow:ellipsis;}
.chat-item:hover,.chat-item.active{background:var(--green-deep); color:#eafff6; box-shadow:inset 0 0 0 1px var(--border);}
.del{opacity:0; color:#ff6b5a; font-weight:bold; cursor:pointer; padding:0 4px; transition:.15s;}
.chat-item:hover .del{opacity:1;}
.sideBtns{display:flex; gap:8px;}
.sideBtns button{flex:1; padding:9px 6px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:12.5px; cursor:pointer; transition:.2s;}
.sideBtns button:hover{background:var(--green-deep); box-shadow:0 0 10px var(--glow);}

/* ===== Чат ===== */
#chatWrap{position:fixed; top:52px; bottom:0; left:0; right:0; display:flex; flex-direction:column;}
#messages{flex:1; overflow-y:auto; padding:20px 16px 20px 16px; display:flex; flex-direction:column; gap:14px; max-width:860px; width:100%; margin:0 auto;}
#empty{margin:auto; text-align:center; color:var(--dim); font-size:26px; letter-spacing:3px; font-weight:700;
  background:linear-gradient(90deg,#7dffd4,var(--green),#4affb0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:pulse 2.4s infinite;}
@keyframes pulse{0%,100%{opacity:.55; text-shadow:0 0 8px var(--glow);}50%{opacity:1; text-shadow:0 0 26px var(--glow);}}
.msg{padding:12px 16px; border-radius:16px; max-width:82%; line-height:1.45; font-size:15px; word-wrap:break-word; white-space:pre-wrap;}
.msg.user{align-self:flex-end; background:linear-gradient(135deg,#0f3b2b,#0d5c40); border:1px solid var(--border); border-bottom-right-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.35);}
.msg.bot{align-self:flex-start; background:var(--panel2); border:1px solid var(--border); border-bottom-left-radius:4px; box-shadow:0 0 14px rgba(0,194,146,.12);}
.msg.error{align-self:center; background:#3a1512; border:1px solid #a33; color:#ffc9c2; font-size:13.5px;}
.dots{display:inline-flex; gap:5px; padding:4px 2px;}
.dots i{width:8px; height:8px; border-radius:50%; background:var(--green); animation:jump 1.1s infinite;}
.dots i:nth-child(2){animation-delay:.18s;} .dots i:nth-child(3){animation-delay:.36s;}
@keyframes jump{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-7px);}}

/* ===== Ввод ===== */
#inputArea{padding:14px; border-top:1px solid var(--border); background:rgba(13,18,14,.85); display:flex; gap:10px; max-width:860px; width:100%; margin:0 auto;}
#inp{flex:1; resize:none; padding:13px 16px; border-radius:12px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:15px; font-family:inherit; outline:none; max-height:130px; transition:.2s;}
#inp:focus{border-color:var(--green); box-shadow:0 0 12px var(--glow);}
#send{width:52px; border-radius:12px; border:none; background:linear-gradient(135deg,var(--green),#00e0a8); color:#06231a; font-size:20px; cursor:pointer; transition:.2s;}
#send:hover{box-shadow:0 0 16px var(--glow); transform:translateY(-1px);}
#send:disabled{opacity:.45; cursor:default; transform:none;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#2a4436; border-radius:4px;}
</style>
</head>
<body>

<div id="topbar">
  <button id="menuBtn" title="История чатов">☰</button>
  <div id="brand">✦ SEMKA AI ✦</div>
  <button id="newChat">＋ Новый чат</button>
</div>

<div id="overlay"></div>
<div id="sidebar">
  <div id="storageWarn">⚠ Браузер не сохраняет данные для этого файла — чаты пропадут при закрытии. Пользуйтесь кнопками «💾 Сохранить» и «📂 Загрузить» ниже.</div>
  <div id="chatList"></div>
  <div class="sideBtns">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
  </div>
</div>

<div id="chatWrap">
  <div id="messages"><div id="empty">✦ SEMKA AI ✦</div></div>
  <div id="inputArea">
    <textarea id="inp" rows="1" placeholder="Напиши Сёмке…"></textarea>
    <button id="send">➤</button>
  </div>
</div>
<input type="file" id="fileInp" accept=".json" style="display:none">

<script>
"use strict";
var MAX_TRIES = 100;      // до 100 попыток достучаться
var RETRY_DELAY = 1500;   // пауза между попытками, мс
var API_URL = "https://text.pollinations.ai/openai";

var chats = [];           // [{title, msgs:[{role,content}]}]
var cur = -1;
var busy = false;
var storageOK = (function(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } })();

var $ = function(id){ return document.getElementById(id); };
var msgBox = $("messages"), inp = $("inp"), sendBtn = $("send"), menuBtn = $("menuBtn");
var sidebar = $("sidebar"), overlay = $("overlay"), chatList = $("chatList");

/* ---------- Хранилище ---------- */
function loadAll(){ if(!storageOK) return; try{ chats = JSON.parse(localStorage.getItem("semka_chats")||"[]"); }catch(e){ chats=[]; } }
function saveAll(){ if(storageOK){ try{ localStorage.setItem("semka_chats", JSON.stringify(chats)); }catch(e){} } }
if(!storageOK) $("storageWarn").style.display = "block";

/* ---------- Панель ---------- */
function togglePanel(open){
  var willOpen = (open===undefined) ? !sidebar.classList.contains("open") : open;
  sidebar.classList.toggle("open", willOpen);
  overlay.classList.toggle("show", willOpen);
  menuBtn.textContent = willOpen ? "✕" : "☰";
}
menuBtn.onclick = function(){ togglePanel(); };
overlay.onclick = function(){ togglePanel(false); };
document.addEventListener("keydown", function(e){ if(e.key==="Escape") togglePanel(false); });

/* ---------- Чаты ---------- */
function curChat(){ return chats[cur] || null; }

function renderList(){
  chatList.innerHTML = "";
  chats.forEach(function(c,i){
    var d = document.createElement("div");
    d.className = "chat-item" + (i===cur?" active":"");
    var t = document.createElement("span"); t.className="t"; t.textContent = c.title || "Чат";
    var x = document.createElement("span"); x.className="del"; x.textContent="✕"; x.title="Удалить чат";
    x.onclick = function(ev){ ev.stopPropagation(); removeChat(i); };
    d.appendChild(t); d.appendChild(x);
    d.onclick = function(){ cur = i; renderList(); renderMsgs(); togglePanel(false); };
    chatList.appendChild(d);
  });
}

function removeChat(i){
  chats.splice(i,1);
  if(chats.length===0){ addChat(); }
  else if(cur===i){ cur = Math.max(0, Math.min(i, chats.length-1)); }
  saveAll(); renderList(); renderMsgs();
}

function addChat(){
  chats.push({title:"", msgs:[]});
  cur = chats.length-1;
  saveAll(); renderList(); renderMsgs();
  togglePanel(false);
}

function renderMsgs(){
  msgBox.innerHTML = "";
  var c = curChat();
  if(!c || c.msgs.length===0){ msgBox.innerHTML = '<div id="empty">✦ SEMKA AI ✦</div>'; return; }
  c.msgs.forEach(function(m){ addBubble(m.role, m.content); });
  msgBox.scrollTop = msgBox.scrollHeight;
}

function addBubble(role, text, isErr){
  var d = document.createElement("div");
  d.className = "msg " + role + (isErr?" error":"");
  d.textContent = text;
  msgBox.appendChild(d);
  return d;
}

/* ---------- Отправка ---------- */
function escPrompt(msgs){
  return msgs.map(function(m){ return (m.role==="user"?"Пользователь: ":"Semka: ")+m.content; }).join("\n");
}

async function askAI(history){
  var systemMsg = {role:"system", content:"Ты — Semka AI, дружелюбный и умный помощник. Отвечай по-русски, живо и по делу."};
  var payload = {model:"openai", messages:[systemMsg].concat(history.slice(-12))};
  var lastErr = null;
  for(var attempt=1; attempt<=MAX_TRIES; attempt++){
    try{
      var r = await fetch(API_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      });
      if(!r.ok) throw new Error("HTTP "+r.status);
      var data = await r.json();
      var text = (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
      if(text.trim()) return text.trim();
      throw new Error("пустой ответ");
    }catch(e){ lastErr = e; await new Promise(function(res){ setTimeout(res, RETRY_DELAY); }); }
  }
  throw lastErr || new Error("нет ответа");
}

async function send(){
  if(busy) return;
  var text = inp.value.trim();
  if(!text) return;
  var c = curChat();
  if(!c) addChat(), c = chats[cur];

  busy = true; sendBtn.disabled = true;
  var emptyEl = $("empty"); if(emptyEl) emptyEl.remove();

  c.msgs.push({role:"user", content:text});
  if(!c.title) c.title = text.slice(0,32);
  addBubble("user", text);
  inp.value = ""; inp.style.height = "auto";
  saveAll(); renderList();
  msgBox.scrollTop = msgBox.scrollHeight;

  var dots = addBubble("bot","");
  dots.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  msgBox.scrollTop = msgBox.scrollHeight;

  try{
    var answer = await askAI(c.msgs.slice(0,-1));
    dots.remove();
    c.msgs.push({role:"bot", content:answer});
    addBubble("bot", answer);
  }catch(e){
    dots.remove();
    addBubble("error","Не смогла достучаться до ИИ после 100 попыток. Проверь интернет и напиши ещё раз — чат сохранён, ничего не потерялось.", true);
  }
  busy = false; sendBtn.disabled = false;
  saveAll(); renderList();
  msgBox.scrollTop = msgBox.scrollHeight;
}

sendBtn.onclick = send;
inp.addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
inp.addEventListener("input", function(){
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 130) + "px";
});
$("newChat").onclick = addChat;

/* ---------- Сохранение/загрузка в файл ---------- */
$("saveBtn").onclick = function(){
  var blob = new Blob([JSON.stringify(chats,null,2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "semka_chats.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
$("loadBtn").onclick = function(){ $("fileInp").click(); };
$("fileInp").onchange = function(e){
  var f = e.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var arr = JSON.parse(rd.result);
      if(Array.isArray(arr)){ chats = arr; cur = chats.length? 0 : -1; if(chats.length===0) addChat(); else { saveAll(); renderList(); renderMsgs(); } }
      else alert("Файл не похож на сохранённые чаты Semka AI.");
    }catch(err){ alert("Не удалось прочитать файл."); }
  };
  rd.readAsText(f);
  e.target.value = "";
};

/* ---------- Старт ---------- */
loadAll();
if(chats.length===0){ chats.push({title:"", msgs:[]}); }
cur = 0;
renderList(); renderMsgs();
</script>
</body>
</html>
